name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-privacy-policy.yml'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          echo "✅ Docs copied to _site/"
          echo "📄 Published pages:"
          find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print live URL
        run: |
          echo "🚀 Docs site is live at:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "📋 Privacy policy page:"
          echo "${{ steps.deployment.outputs.page_url }}privacy-policy.html"
          echo ""
          echo "📋 Paste this URL into Play Console:"
          echo "   ${{ steps.deployment.outputs.page_url }}privacy-policy.html"
