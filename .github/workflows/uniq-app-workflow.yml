name: Uniq App Workflow

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: uniq-app-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app runtime paths
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r backend/requirements.txt
          else
            echo "No backend/requirements.txt found; skipping backend dependency install."
          fi

      - name: Validate backend syntax
        run: |
          if [ -f backend/open_source_server.py ]; then
            python -m py_compile backend/open_source_server.py
          else
            echo "No backend/open_source_server.py found; skipping syntax check."
          fi

      - name: Backend smoke test
        run: |
          if [ -f backend/open_source_server.py ]; then
            export BUTLER_SERVER_PORT=18080
            python backend/open_source_server.py &
            SERVER_PID=$!

            cleanup() {
              kill "$SERVER_PID" 2>/dev/null || true
            }
            trap cleanup EXIT

            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:18080/health >/dev/null; then
                break
              fi
              sleep 1
            done

            curl -sf http://127.0.0.1:18080/health
            curl -sf http://127.0.0.1:18080/api/status
          else
            echo "No backend/open_source_server.py found; skipping backend smoke test."
          fi

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install app dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run existing app checks
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          has_script() {
            node -e "const s=require('./package.json').scripts||{}; process.exit(s['$1']?0:1)"
          }

          if has_script lint; then npm run lint; fi
          if has_script test; then npm test -- --watch=false; fi
          if has_script build; then npm run build; fi
