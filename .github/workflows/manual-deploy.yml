name: Manual Deploy — Redeploy Zip to Main

# Use this if the automatic deployment didn't fire, or if you want to
# force-redeploy a zip that is already sitting on the update branch.
# Just go to Actions → "Manual Deploy" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm you want to deploy the current zip on the update branch"
        required: true
        default: ""

concurrency:
  group: zip-deploy
  cancel-in-progress: false

permissions:
  contents: write
  workflows: write

jobs:
  manual-deploy:
    name: Manual deploy zip to main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'YES'

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: update
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Find zip ───────────────────────────────────────────────────────
      - name: Find zip file
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH=$(find . -not -path './.git/*' -name '*.zip' | sort | head -1)
          if [ -z "$ZIP_PATH" ]; then
            echo "### ⚠️ No zip found" >> "$GITHUB_STEP_SUMMARY"
            echo "No zip file found on the update branch. Upload a zip first." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No zip file found on the update branch."
            exit 1
          fi
          echo "found=true"          >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH"  >> "$GITHUB_OUTPUT"
          echo "### 📦 Zip found (manual deploy)" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`$ZIP_PATH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -sh "$ZIP_PATH" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # ── 3. Integrity check ────────────────────────────────────────────────
      - name: Verify zip integrity
        id: integrity
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.find_zip.outputs.zip_path }}"
          if unzip -t "$ZIP" > /tmp/zip-integrity.txt 2>&1; then
            FILE_COUNT=$(grep -c 'testing:' /tmp/zip-integrity.txt || true)
            echo "- Integrity: ✅ OK ($FILE_COUNT entries)" >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/zip-integrity.txt >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Zip file is corrupted — deployment aborted."
            exit 1
          fi

      # ── 4. Extract ────────────────────────────────────────────────────────
      - name: Extract zip
        id: extract_zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zip_extract /tmp/zip_source
          mkdir -p /tmp/zip_extract /tmp/zip_source
          unzip -q -o "${{ steps.find_zip.outputs.zip_path }}" -d /tmp/zip_extract

          python3 - <<'PY'
          import os, shutil, sys
          src  = "/tmp/zip_extract"
          dest = "/tmp/zip_source"
          items = [os.path.join(src, name) for name in os.listdir(src)]
          dirs  = [item for item in items if os.path.isdir(item)]
          root  = dirs[0] if len(items) == 1 and len(dirs) == 1 else src
          moved = 0
          for name in os.listdir(root):
              shutil.move(os.path.join(root, name), os.path.join(dest, name))
              moved += 1
          if moved == 0:
              print("ERROR: zip extracted 0 files", file=sys.stderr)
              sys.exit(1)
          print(f"Moved {moved} top-level entries to {dest}")
          PY

          EXTRACTED=$(find /tmp/zip_source -type f | wc -l)
          echo "source_dir=/tmp/zip_source" >> "$GITHUB_OUTPUT"
          echo "extracted_files=$EXTRACTED" >> "$GITHUB_OUTPUT"
          echo "- Extracted: **$EXTRACTED files**" >> "$GITHUB_STEP_SUMMARY"

      # ── 5. OnSpace compatibility check ───────────────────────────────────
      - name: Validate OnSpace compatibility
        id: validate_zip
        shell: bash
        run: |
          set +e
          node ./tools/check-onspace-compat.mjs "${{ steps.extract_zip.outputs.source_dir }}" > /tmp/onspace-compat.txt 2>&1
          STATUS=$?
          set -e
          cat /tmp/onspace-compat.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::OnSpace compatibility check failed — deployment blocked."
            exit 1
          fi

      # ── 6. Deploy to main ─────────────────────────────────────────────────
      - name: Deploy extracted contents to main
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          git ls-files -z | xargs -0 rm -f
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -R "${{ steps.extract_zip.outputs.source_dir }}/." .

          git add -A
          if git diff --cached --quiet; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "### ℹ️ No change — main already matches this zip." >> "$GITHUB_STEP_SUMMARY"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            git commit -m "deploy(manual): replace main from zip — $TIMESTAMP"

            for ATTEMPT in 1 2 3; do
              if git push origin main; then
                echo "deployed=true" >> "$GITHUB_OUTPUT"
                echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
                break
              fi
              if [ "$ATTEMPT" -lt 3 ]; then
                echo "Push attempt $ATTEMPT failed — retrying in 10 s …"
                sleep 10
                git fetch origin main
                git rebase origin/main
              else
                echo "::error::All 3 push attempts failed."
                exit 1
              fi
            done

            echo "### ✅ Manual deployment complete" >> "$GITHUB_STEP_SUMMARY"
            echo "- Deployed to \`main\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Files: ${{ steps.extract_zip.outputs.extracted_files }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 7. Verify ─────────────────────────────────────────────────────────
      - name: Verify deployment on main
        if: steps.deploy.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          REMOTE_SHA=$(git rev-parse origin/main)
          if [ "$REMOTE_SHA" = "$DEPLOY_SHA" ]; then
            echo "### 🔒 Verified — remote main matches deployed commit ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Verification failed — SHA mismatch ($REMOTE_SHA vs $DEPLOY_SHA)."
            exit 1
          fi

      # ── 8. Cleanup ────────────────────────────────────────────────────────
      - name: Cleanup temp files
        if: always()
        shell: bash
        run: rm -rf /tmp/zip_extract /tmp/zip_source /tmp/onspace-compat.txt /tmp/zip-integrity.txt
