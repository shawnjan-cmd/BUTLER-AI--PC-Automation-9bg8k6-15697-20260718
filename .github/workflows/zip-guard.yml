name: Zip Guard — Auto-Restore Deleted Zips on Update Branch

# Watches every push to `update`.  If any *.zip was deleted (by anyone or
# anything), it is immediately restored from the previous commit and pushed
# back — which in turn re-triggers the deployment workflow automatically.

on:
  push:
    branches:
      - update

concurrency:
  group: zip-guard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    name: Protect zip files on update branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout with enough history to compare ────────────────────────
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: update
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Detect deleted zips ────────────────────────────────────────────
      - name: Detect deleted zip files
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # First commit has no parent — nothing to guard yet
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [ "$COMMIT_COUNT" -lt 2 ]; then
            echo "deleted_zips=" >> "$GITHUB_OUTPUT"
            echo "ℹ️ First commit on branch — nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Skip if this is a restore commit made by this very guard
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if echo "$COMMIT_MSG" | grep -q '\[zip-guard\]'; then
            echo "deleted_zips=" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Guard-authored commit — skipping self-check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DELETED=$(git diff --name-only --diff-filter=D HEAD~1 HEAD | grep '\.zip$' || true)

          if [ -z "$DELETED" ]; then
            echo "deleted_zips=" >> "$GITHUB_OUTPUT"
            echo "✅ No zip files were deleted — update branch is intact." >> "$GITHUB_STEP_SUMMARY"
          else
            # Newlines break GITHUB_OUTPUT; use | as delimiter
            DELIMITED=$(echo "$DELETED" | tr '\n' '|' | sed 's/|$//')
            echo "deleted_zips=$DELIMITED" >> "$GITHUB_OUTPUT"
            echo "### 🚨 Zip deletion detected" >> "$GITHUB_STEP_SUMMARY"
            echo "The following zip(s) were removed from the update branch:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$DELETED" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Auto-restoring now…" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 3. Restore any deleted zips ───────────────────────────────────────
      - name: Restore deleted zip files
        if: steps.check.outputs.deleted_zips != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          RESTORED=0
          IFS='|' read -ra ZIPS <<< "${{ steps.check.outputs.deleted_zips }}"
          for ZIP_PATH in "${ZIPS[@]}"; do
            [ -z "$ZIP_PATH" ] && continue
            echo "Restoring: $ZIP_PATH"
            mkdir -p "$(dirname "$ZIP_PATH")"
            git show HEAD~1:"$ZIP_PATH" > "$ZIP_PATH"
            git add "$ZIP_PATH"
            RESTORED=$((RESTORED + 1))
          done

          if [ "$RESTORED" -gt 0 ]; then
            git commit -m "restore: zip protected from deletion — auto-restored [zip-guard]"
            # Push with retry
            for ATTEMPT in 1 2 3; do
              if git push origin update; then
                break
              fi
              if [ "$ATTEMPT" -lt 3 ]; then
                echo "Push attempt $ATTEMPT failed — retrying in 5 s …"
                sleep 5
                git fetch origin update
                git rebase origin/update
              else
                echo "::error::Failed to restore zip after 3 attempts."
                exit 1
              fi
            done
            echo "### ✅ Zip(s) restored" >> "$GITHUB_STEP_SUMMARY"
            echo "- Restored **$RESTORED** zip file(s) and pushed back to \`update\`." >> "$GITHUB_STEP_SUMMARY"
            echo "- The deployment workflow will re-run automatically on the restored zip." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 4. Fail loudly if restore failed ─────────────────────────────────
      - name: Annotate if zip was deleted
        if: steps.check.outputs.deleted_zips != '' && failure()
        run: |
          echo "::error::One or more zip files were deleted from the update branch and could not be automatically restored. Check the workflow logs immediately."
